<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      // 1. Define your target destination URL
      const targetBaseUrl = "https://soaringeagle.app";

      // 2. Grab current URL query parameters (if any were passed in)
      const currentParams = new URLSearchParams(window.location.search);

      // 3. Define the default/desired UTM parameters you want to inject or ensure
      const defaultUtms = {
        utm_source: "Instagram",
        utm_medium: "redirect",
        utm_campaign: ""
      };

      // 4. Merge existing params with defaults (existing params override defaults)
      for (const [key, value] of Object.entries(defaultUtms)) {
        if (!currentParams.has(key)) {
          currentParams.set(key, value);
        }
      }

      // 5. Build final URL and redirect
      const finalUrl = `${targetBaseUrl}?${currentParams.toString()}`;
      window.location.replace(finalUrl);
    })();
  </script>
</head>
<body>
  <p>If you are not redirected automatically, please <a id="fallback-link" href="#">click here</a>.</p>
  <script>
    document.getElementById("fallback-link").href = window.location.href;
  </script>
</body>
</html>
